<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/style.css" />
    <title>WDD330 Anime List and Scene finder</title>
</head>

<body>

    <header>
        <nav class="navbar">
            <div class="logo">
                WDD330 Anime and Scene Finder
            </div>

            <button class="menu-toggle" id="menu-toggle">
            ☰
            </button>

            <ul class="nav-links" id="nav-links">
            <li><a href="/">Home</a></li>
            <li class="search-menu" id="searchToggle">
                    <a href="#">Search Anime</a>

                <div class="search-dropdown hidden" id="searchDropdown">
                    <input
                    type="text"
                    id="searchInput"
                    placeholder="Search..."
                    />

                    <div class="search-options">
                    <label>                        
                        Genres
                        <input type="radio" name="searchType" value="genres" checked>
                    </label>

                    <label>                        
                        Category
                        <input type="radio" name="searchType" value="category">
                    </label>

                    <label>                        
                        Anime Name
                        <input type="radio" name="searchType" value="anime">
                    </label>

                    <label>                        
                        Anime Type
                        <input type="radio" name="searchType" value="type">
                    </label>

                    <label>
                        Anime status
                        <input type="radio" name="searchType" value="status">                        
                    </label>
                    </div>
                    <button id="searchBtn">Search</button>
                </div>
            </li>
            <li><a href="/scene">Find Scene</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="anime-list" class="anime-grid">
        </section>
        <div class="pagination">
            <button id="previous" class="pagination-btn">
                Previous
            </button>

            <button id="next" class="pagination-btn">
                Next
            </button>
        </div>
    </main>

    <script type="module" src="./js/main.js"></script>
</body>
</html>
