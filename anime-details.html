<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Anime Details</title>
</head>

<body>

    <div id="details"></div>

    <script type="module">

        import AnimeDetails
            from "./js/AnimeDetails.js";

        const params =
            new URLSearchParams(
                window.location.search
            );

        const id =
            params.get("id");

        const details =
            new AnimeDetails(id);

        details.init();

    </script>

</body>

</html>
